<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-4">

    <h2 class="text-center mb-4">Product Management System</h2>



    <div class="card shadow mb-4">

        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">

            <h5 class="mb-0">Product List</h5>

        </div>

        <div class="card-body">

            <table class="table table-bordered table-hover text-center">

                <thead class="table-light">

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Actions</th>

                </tr>

                </thead>

                <tbody id="productTable">

                </tbody>

            </table>

        </div>

    </div>



    <div class="card shadow mb-4">

        <div class="card-header bg-success text-white">

            <h5 id="formTitle" class="mb-0">Add Product</h5>

        </div>

        <div class="card-body">

            <form id="productForm">

                <input type="hidden" id="productId">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Name</label>

                        <input
                                type="text"
                                id="name"
                                class="form-control"
                                placeholder="Enter product name">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Category</label>

                        <select
                                id="category"
                                class="form-select">

                            <option value="">Select Category</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Price </label>

                        <input
                                type="number"
                                id="price"
                                class="form-control"
                                placeholder="Enter price">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Stock</label>

                        <input
                                type="number"
                                id="stock"
                                class="form-control"
                                placeholder="Enter stock">

                    </div>

                    <div class="col-12 mb-3">

                        <label class="form-label">Description</label>

                        <textarea
                                id="description"
                                rows="3"
                                class="form-control"
                                placeholder="Enter description"></textarea>

                    </div>

                </div>

                <div class="text-end">

                    <button
                            type="button"
                            id="cancelBtn"
                            class="btn btn-secondary">

                        Cancel

                    </button>

                    <button
                            type="submit"
                            id="saveBtn"
                            class="btn btn-primary">

                        Save

                    </button>

                </div>

            </form>

        </div>

    </div>



    <div class="card shadow">

        <div class="card-header bg-dark text-white">

            <h5 class="mb-0">Get Product By ID</h5>

        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-4">

                    <input
                            type="number"
                            id="searchId"
                            class="form-control"
                            placeholder="Enter Product ID">

                </div>

                <div class="col-md-2">

                    <button
                            class="btn btn-primary w-100"
                            onclick="searchProduct()">

                        Search

                    </button>

                </div>

            </div>

            <table class="table table-bordered">

                <tr>
                    <th>ID</th>
                    <td id="detailId">-</td>
                </tr>

                <tr>
                    <th>Name</th>
                    <td id="detailName">-</td>
                </tr>

                <tr>
                    <th>Category</th>
                    <td id="detailCategory">-</td>
                </tr>

                <tr>
                    <th>Price</th>
                    <td id="detailPrice">-</td>
                </tr>

                <tr>
                    <th>Stock</th>
                    <td id="detailStock">-</td>
                </tr>

                <tr>
                    <th>Description</th>
                    <td id="detailDescription">-</td>
                </tr>

            </table>



            <div class="mt-3">

                <button
                        id="backBtn"
                        class="btn btn-secondary">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to List

                </button>





            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
